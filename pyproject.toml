[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streamforge-core"
version = "0.1.0"
description = "Typed inspection workflows with multiprocessing, pluggable operators and Redis transport"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["inspection", "redis", "streaming", "multiprocessing", "pydantic", "operators"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.128,<1", "uvicorn>=0.40,<1"]
redis = ["redis>=6.4,<8"]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "httpx2>=2.13,<3",
    "build>=1.2,<2",
    "ruff>=0.14,<1",
]

[project.scripts]
streamforge = "streamforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["redis: requires an isolated real Redis server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_redis_transport.py" = ["E402"]
"tests/test_service.py" = ["E402"]
