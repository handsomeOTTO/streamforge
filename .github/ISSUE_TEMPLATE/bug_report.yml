name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exclude credentials, private addresses, customer data, and image assets you cannot share.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include package version, Python version, OS, worker counts, and queue limits.
    validations:
      required: true
