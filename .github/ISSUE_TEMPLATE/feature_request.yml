name: Feature request
description: Describe a problem and the outcome you need.
body:
  - type: textarea
    id: need
    attributes:
      label: Problem and desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility considerations
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and acceptance criteria
